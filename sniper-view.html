<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX AI SNIPER PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #050816;
  --bg-secondary: #0a0f1e;
  --bg-card: rgba(10, 15, 30, 0.85);
  --border: rgba(0, 255, 170, 0.15);
  --text-primary: #ffffff;
  --text-secondary: #8892a6;
  --text-muted: #4a5568;
  --neon-green: #00ffaa;
  --neon-green-dim: rgba(0, 255, 170, 0.4);
  --neon-red: #ff4d6d;
  --neon-red-dim: rgba(255, 77, 77, 0.4);
  --neon-cyan: #00d4ff;
  --neon-cyan-dim: rgba(0, 212, 255, 0.3);
  --neon-gold: #facc15;
  --glass-bg: rgba(5, 8, 22, 0.9);
  --glass-border: rgba(0, 255, 170, 0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg-primary);
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(0, 255, 170, 0.03) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(0, 212, 255, 0.02) 0%, transparent 50%),
    linear-gradient(180deg, #050816 0%, #0a0f1e 50%, #050816 100%);
  color: var(--text-primary);
  font-family: 'Inter', -apple-system, sans-serif;
  font-size: 12px;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

/* TOP BAR */
#topbar {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 24px;
  height: 56px;
  background: rgba(5, 8, 22, 0.95);
  border-bottom: 1px solid var(--glass-border);
  backdrop-filter: blur(20px);
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
}

.logo {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  font-weight: 700;
  color: var(--neon-green);
  letter-spacing: 2px;
  text-shadow: 0 0 20px rgba(0, 255, 170, 0.5);
}

.pair-info {
  display: flex;
  align-items: center;
  gap: 12px;
}

.pair-name {
  font-size: 18px;
  font-weight: 700;
  color: #fff;
}

.pair-price {
  font-family: 'JetBrains Mono', monospace;
  font-size: 20px;
  font-weight: 600;
  color: var(--neon-green);
  text-shadow: 0 0 15px rgba(0, 255, 170, 0.4);
}

.pair-price.up { color: var(--neon-green); }
.pair-price.down { color: var(--neon-red); }

.mode-indicator {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  background: rgba(0, 255, 170, 0.08);
  border: 1px solid rgba(0, 255, 170, 0.25);
  border-radius: 20px;
}

.mode-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--neon-green);
  box-shadow: 0 0 10px var(--neon-green);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.mode-text {
  font-size: 11px;
  font-weight: 600;
  color: var(--neon-green);
  letter-spacing: 1px;
}

.topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}

.topbar-btn {
  padding: 8px 16px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.topbar-btn:hover {
  background: rgba(0, 255, 170, 0.1);
  border-color: rgba(0, 255, 170, 0.3);
  color: var(--neon-green);
}

.topbar-btn.active {
  background: rgba(0, 255, 170, 0.15);
  border-color: rgba(0, 255, 170, 0.4);
  color: var(--neon-green);
}

/* PAIR BUTTONS */
.pair-buttons {
  display: flex;
  gap: 6px;
}

.pair-btn {
  padding: 6px 12px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 6px;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.pair-btn:hover {
  background: rgba(255, 255, 255, 0.08);
  color: var(--text-secondary);
}

.pair-btn.active {
  background: rgba(0, 255, 170, 0.12);
  border-color: var(--neon-green);
  color: var(--neon-green);
  box-shadow: 0 0 15px rgba(0, 255, 170, 0.2);
}

/* CHART CONTAINER */
#chart-wrapper {
  position: fixed;
  top: 56px;
  left: 0;
  right: 0;
  bottom: 0;
}

#chart-container {
  width: 100%;
  height: 100%;
}

/* CROSSHAIR CANVAS */
#crosshair-canvas {
  position: fixed;
  top: 56px;
  left: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
  z-index: 10;
}

/* PREDICTION CANVAS */
#projection-canvas {
  position: fixed;
  top: 56px;
  left: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
  z-index: 5;
}

/* PREDICTION ZONES */
.prediction-overlay {
  position: fixed;
  top: 56px;
  left: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
  z-index: 4;
}

#prediction-zone-long {
  position: absolute;
  left: 0;
  right: 0;
  background: linear-gradient(to top, rgba(0, 255, 170, 0.15) 0%, rgba(0, 255, 170, 0.05) 50%, transparent 100%);
  border-top: 2px solid rgba(0, 255, 170, 0.4);
  box-shadow: 0 0 40px rgba(0, 255, 170, 0.15);
  display: none;
}

#prediction-zone-short {
  position: absolute;
  left: 0;
  right: 0;
  background: linear-gradient(to bottom, rgba(255, 77, 77, 0.15) 0%, rgba(255, 77, 77, 0.05) 50%, transparent 100%);
  border-bottom: 2px solid rgba(255, 77, 77, 0.4);
  box-shadow: 0 0 40px rgba(255, 77, 77, 0.15);
  display: none;
}

.zone-label {
  position: absolute;
  padding: 4px 10px;
  border-radius: 4px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
}

.zone-label.tp {
  background: rgba(0, 255, 170, 0.25);
  color: var(--neon-green);
  border: 1px solid rgba(0, 255, 170, 0.4);
}

.zone-label.sl {
  background: rgba(255, 77, 77, 0.25);
  color: var(--neon-red);
  border: 1px solid rgba(255, 77, 77, 0.4);
}

/* AI PANEL */
#ai-panel {
  position: fixed;
  top: 70px;
  right: 16px;
  width: 240px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  padding: 18px;
  z-index: 50;
  backdrop-filter: blur(24px);
  box-shadow:
    0 0 40px rgba(0, 0, 0, 0.5),
    0 0 80px rgba(0, 255, 170, 0.05),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);
  display: none;
}

#ai-panel.visible { display: block; }

.ai-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}

.ai-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: linear-gradient(135deg, rgba(0, 255, 170, 0.2), rgba(0, 212, 255, 0.1));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.ai-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--neon-green);
  letter-spacing: 1px;
}

.ai-subtitle {
  font-size: 9px;
  color: var(--text-muted);
  letter-spacing: 1px;
  margin-top: 2px;
}

.ai-metric {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.03);
}

.ai-metric:last-child { border-bottom: none; }

.ai-metric-label {
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
}

.ai-metric-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
}

.ai-metric-value.green { color: var(--neon-green); text-shadow: 0 0 10px rgba(0, 255, 170, 0.4); }
.ai-metric-value.red { color: var(--neon-red); text-shadow: 0 0 10px rgba(255, 77, 77, 0.4); }
.ai-metric-value.gold { color: var(--neon-gold); text-shadow: 0 0 10px rgba(250, 204, 21, 0.4); }
.ai-metric-value.cyan { color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0, 212, 255, 0.4); }

/* SIGNAL BADGE */
#signal-badge {
  position: fixed;
  top: 70px;
  left: 16px;
  padding: 12px 20px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1px;
  z-index: 50;
  backdrop-filter: blur(16px);
  display: none;
}

#signal-badge.visible { display: flex; align-items: center; gap: 10px; }

#signal-badge.long {
  background: rgba(0, 255, 170, 0.15);
  border: 1px solid rgba(0, 255, 170, 0.4);
  color: var(--neon-green);
  box-shadow: 0 0 30px rgba(0, 255, 170, 0.25), 0 4px 20px rgba(0, 0, 0, 0.3);
}

#signal-badge.short {
  background: rgba(255, 77, 77, 0.15);
  border: 1px solid rgba(255, 77, 77, 0.4);
  color: var(--neon-red);
  box-shadow: 0 0 30px rgba(255, 77, 77, 0.25), 0 4px 20px rgba(0, 0, 0, 0.3);
}

.signal-badge-icon {
  font-size: 18px;
}

/* TRADE LEVELS PANEL */
#levels-panel {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 16px;
  padding: 14px 24px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: 16px;
  backdrop-filter: blur(24px);
  z-index: 50;
  box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
}

.level-item {
  text-align: center;
  min-width: 80px;
}

.level-label {
  font-size: 9px;
  color: var(--text-muted);
  letter-spacing: 1px;
  margin-bottom: 4px;
}

.level-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 600;
}

.level-value.entry { color: var(--neon-gold); }
.level-value.tp { color: var(--neon-green); }
.level-value.sl { color: var(--neon-red); }

.level-bar {
  height: 3px;
  border-radius: 2px;
  margin-top: 6px;
  overflow: hidden;
}

.level-bar .fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.3s;
}

.level-bar.entry .fill { background: var(--neon-gold); }
.level-bar.tp .fill { background: var(--neon-green); }
.level-bar.sl .fill { background: var(--neon-red); }

/* PROBABILITY BARS */
.prob-container {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
}

.prob-header {
  font-size: 9px;
  color: var(--text-muted);
  letter-spacing: 1px;
  margin-bottom: 10px;
}

.prob-bars {
  display: flex;
  gap: 8px;
}

.prob-bar {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  text-align: center;
}

.prob-bar.up {
  background: rgba(0, 255, 170, 0.1);
  border: 1px solid rgba(0, 255, 170, 0.2);
}

.prob-bar.down {
  background: rgba(255, 77, 77, 0.1);
  border: 1px solid rgba(255, 77, 77, 0.2);
}

.prob-bar-label {
  font-size: 9px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}

.prob-bar-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 18px;
  font-weight: 700;
}

.prob-bar.up .prob-bar-value { color: var(--neon-green); text-shadow: 0 0 15px rgba(0, 255, 170, 0.5); }
.prob-bar.down .prob-bar-value { color: var(--neon-red); text-shadow: 0 0 15px rgba(255, 77, 77, 0.5); }

/* WARNING BANNER */
#warning-banner {
  display: none;
  position: fixed;
  top: 56px;
  left: 0;
  right: 0;
  text-align: center;
  padding: 10px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  z-index: 99;
}

#warning-banner.sweep {
  display: block;
  background: rgba(255, 77, 77, 0.12);
  border-bottom: 1px solid rgba(255, 77, 77, 0.3);
  color: var(--neon-red);
}

#warning-banner.fake {
  display: block;
  background: rgba(250, 204, 21, 0.1);
  border-bottom: 1px solid rgba(250, 204, 21, 0.3);
  color: var(--neon-gold);
}

/* SCANNER LINE EFFECT */
#scanner-line {
  position: fixed;
  top: 56px;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
  opacity: 0.3;
  z-index: 3;
  pointer-events: none;
  animation: scan 8s linear infinite;
}

@keyframes scan {
  0% { top: 56px; }
  100% { top: 100vh; }
}

/* SCAN LINES OVERLAY */
#scan-overlay {
  position: fixed;
  top: 56px;
  left: 0;
  right: 0;
  bottom: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 255, 170, 0.01) 2px,
    rgba(0, 255, 170, 0.01) 4px
  );
  pointer-events: none;
  z-index: 2;
}

/* HOLOGRAPHIC GLOW */
#holo-glow {
  position: fixed;
  top: 20%;
  left: 50%;
  transform: translateX(-50%);
  width: 600px;
  height: 300px;
  background: radial-gradient(ellipse, rgba(0, 255, 170, 0.03) 0%, transparent 70%);
  pointer-events: none;
  z-index: 1;
}
</style>
</head>
<body>

<div id="scanner-line"></div>

    <span class="ai-metric-label">DIRECTION</span>

<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
const API_URL = location.protocol === 'file:' ? 'http://localhost:3001' : location.origin;

let chart = null, candleSeries = null;
let markers = [];
let activePair = 'LABUSDT';
let latestPrices = {};
let activeRequestId = 0;
let candleData = [];
let gridVisible = true;
let chartInitialized = false;

function fmt(v) { return v == null ? '--' : Number(v).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:4}); }

function calcEMA(values, period) {
  if (values.length < period) return null;
  var k = 2 / (period + 1);
  var e = values.slice(0, period).reduce(function(a, b) { return a + b; }, 0) / period;
  for (var i = period; i < values.length; i++) e = values[i] * k + e * (1 - k);
  return e;
}

function getATR(data, len) {
  len = len || 14;
  if (!data || data.length < len + 1) return null;
  var trs = [];
  for (var i = 1; i < data.length; i++) {
    var high = data[i].high;
    var low = data[i].low;
    var prevClose = data[i - 1].close;
    trs.push(Math.max(high - low, Math.abs(high - prevClose), Math.abs(low - prevClose)));
  }
  return trs.slice(-len).reduce(function(a, b) { return a + b; }, 0) / len;
}

function initChart() {
  if (chartInitialized) return;
  chartInitialized = true;
  const container = document.getElementById('chart-container');
  chart = LightweightCharts.createChart(container, {
    layout: {
      background: { color: 'transparent' },
      textColor: '#4a5568',
      fontFamily: 'JetBrains Mono',
    },
    grid: {
      vertLines: { color: 'rgba(255, 255, 255, 0.03)' },
      horzLines: { color: 'rgba(255, 255, 255, 0.03)' }
    },
    width: container.clientWidth,
    height: container.clientHeight,
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
      vertLine: { color: 'rgba(0, 212, 255, 0.4)', width: 1, style: 2 },
      horzLine: { color: 'rgba(0, 212, 255, 0.4)', width: 1, style: 2 }
    },
    timeScale: {
      borderColor: 'rgba(255, 255, 255, 0.05)',
      timeVisible: true,
      secondsVisible: false
    },
    rightPriceScale: {
      borderVisible: false,
      scaleMargins: { top: 0.1, bottom: 0.1 }
    },
  });

  candleSeries = chart.addCandlestickSeries({
    upColor: '#00ffaa',
    downColor: '#ff4d6d',
    borderUpColor: '#00ffaa',
    borderDownColor: '#ff4d6d',
    wickUpColor: 'rgba(0, 255, 170, 0.8)',
    wickDownColor: 'rgba(255, 77, 77, 0.8)',
  });

  window.addEventListener('resize', () => {
    chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
  });

  initCrosshair();
}

function initCrosshair() {
  const crosshairCanvas = document.getElementById('crosshair-canvas');
  const ctx = crosshairCanvas.getContext('2d');

  function drawCrosshair(mouseX, mouseY) {
    ctx.clearRect(0, 0, crosshairCanvas.width, crosshairCanvas.height);
    if (!chart) return;

    const chartRect = document.getElementById('chart-container').getBoundingClientRect();
    crosshairCanvas.width = window.innerWidth;
    crosshairCanvas.height = window.innerHeight;

    const price = candleSeries.coordinateToPrice(mouseY - chartRect.top);
    const time = chart.timeScale().coordinateToTime(mouseX - chartRect.left);

    if (price != null && time != null) {
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = 'rgba(0, 212, 255, 0.3)';
      ctx.lineWidth = 1;

      ctx.beginPath();
      ctx.moveTo(0, mouseY);
      ctx.lineTo(window.innerWidth, mouseY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(mouseX, 0);
      ctx.lineTo(mouseX, window.innerHeight);
      ctx.stroke();

      ctx.setLineDash([]);
    }
  }

  document.getElementById('chart-wrapper').addEventListener('mousemove', function(e) {
    drawCrosshair(e.clientX, e.clientY);
  });
}

function toggleGrid() {
  gridVisible = !gridVisible;
  chart.applyOptions({
    grid: { vertLines: { visible: gridVisible }, horzLines: { visible: gridVisible } }
  });
}

function detectLabSignal(candles) {
  if (!candles || candles.length < 32) return null;
  var c = candles[candles.length - 1];
  var prev = candles[candles.length - 2];
  if (!c || !prev) return null;

  var closes = candles.map(function(x) { return x.close; });
  var ema5 = calcEMA(closes, 5);
  var ema10 = calcEMA(closes, 10);
  var ema30 = calcEMA(closes, 30);
  var atr = getATR(candles, 14);

  if (!ema5 || !ema10 || !ema30 || !atr) return null;

  var bullTrend = ema5 > ema10 && ema10 > ema30;
  var bearTrend = ema5 < ema10 && ema10 < ema30;

  var range = c.high - c.low;
  var body = Math.abs(c.close - c.open);
  var upperWick = c.high - Math.max(c.open, c.close);
  var lowerWick = Math.min(c.open, c.close) - c.low;

  var bullRejection = lowerWick / range > 0.3;
  var bearRejection = upperWick / range > 0.3;
  var strongBull = c.close > c.open && body / range > 0.5;
  var strongBear = c.close < c.open && body / range > 0.5;

  var last20 = candles.slice(-20);
  var support = Math.min.apply(null, last20.map(function(x) { return x.low; }));
  var resistance = Math.max.apply(null, last20.map(function(x) { return x.high; }));
  var fib50 = support + (resistance - support) * 0.5;

  var score = { long: 0, short: 0 };
  var reasons = [];

  if (bullTrend) { score.long += 2; reasons.push('bull_trend'); }
  if (bearTrend) { score.short += 2; reasons.push('bear_trend'); }
  if (bullRejection) { score.long += 1; reasons.push('bull_reject'); }
  if (bearRejection) { score.short += 1; reasons.push('bear_reject'); }
  if (strongBull) { score.long += 1; reasons.push('strong_bull'); }
  if (strongBear) { score.short += 1; reasons.push('strong_bear'); }
  if (c.close > fib50 && bullTrend) { score.long += 1; reasons.push('above_fib50'); }
  if (c.close < fib50 && bearTrend) { score.short += 1; reasons.push('below_fib50'); }

  var upperWickPct = range > 0 ? upperWick / range : 0;
  var lowerWickPct = range > 0 ? lowerWick / range : 0;
  if (c.high > resistance && c.close < resistance && upperWickPct > 0.35) {
    score.short += 3;
    reasons.push('liq_sweep_short');
  }
  if (c.low < support && c.close > support && lowerWickPct > 0.35) {
    score.long += 3;
    reasons.push('liq_sweep_long');
  }

  var direction = 'WAIT';
  if (score.long >= 2 && score.long > score.short) direction = 'LONG';
  if (score.short >= 2 && score.short > score.long) direction = 'SHORT';

  var entry = c.close;
  var sl = null, tp = null;
  if (direction === 'LONG') {
    sl = entry - atr * 0.8;
    tp = entry + atr * 2;
  }
  if (direction === 'SHORT') {
    sl = entry + atr * 0.8;
    tp = entry - atr * 2;
  }

  var rr = null;
  if (sl && tp && entry) {
    rr = Math.abs(tp - entry) / Math.abs(entry - sl);
  }
  if (direction !== 'WAIT' && rr !== null && rr < 1.0) {
    direction = 'WAIT';
    reasons.push('rr_low');
  }

  var trend = bullTrend ? 'BULLISH' : bearTrend ? 'BEARISH' : 'SIDEWAYS';
  var moveSize = tp && entry ? Math.abs(tp - entry) / entry * 100 : 0;

  return {
    type: direction,
    direction: direction,
    entry: entry,
    tp: tp,
    sl: sl,
    rr: rr,
    score: direction === 'LONG' ? score.long : score.short,
    reasons: reasons,
    trend: trend,
    atr: atr,
    support: support,
    resistance: resistance,
    moveSize: moveSize,
    bullTrend: bullTrend,
    bearTrend: bearTrend,
    bullRejection: bullRejection,
    bearRejection: bearRejection,
    liqSweepShort: c.high > resistance && c.close < resistance && upperWickPct > 0.35,
    liqSweepLong: c.low < support && c.close > support && lowerWickPct > 0.35,
    fakeBreakout: (upperWickPct > 0.4 && c.close < c.open) || (lowerWickPct > 0.4 && c.close > c.open),
    strongBull: strongBull,
    strongBear: strongBear,
    candle: { time: c.time, open: c.open, high: c.high, low: c.low, close: c.close }
  };
}

function updateAIPanel(sig) {
  var panel = document.getElementById('ai-panel');
  if (!sig || sig.direction === 'WAIT') {
    panel.classList.remove('visible');
    return;
  }
  panel.classList.add('visible');

  var score = sig.score || 0;
  var winrate = Math.round(score * 18);
  var rr = sig.rr || 0;
  var moveSize = sig.moveSize || 0;

  document.getElementById('ai-dir').textContent = sig.direction;
  document.getElementById('ai-score').textContent = Math.min(99, score * 12) + '%';
  document.getElementById('ai-winrate').textContent = winrate + '%';
  document.getElementById('ai-rr').textContent = rr ? '1:' + rr.toFixed(1) : '--';
  document.getElementById('ai-move').textContent = moveSize.toFixed(2) + '%';
  document.getElementById('ai-mode').textContent = sig.trend || '--';

  var probUp = 50, probDown = 50;
  if (sig.direction === 'LONG') {
    probUp = Math.min(95, 50 + score * 8);
    probDown = 100 - probUp;
  } else if (sig.direction === 'SHORT') {
    probDown = Math.min(95, 50 + score * 8);
    probUp = 100 - probDown;
  }
  document.getElementById('prob-up').textContent = Math.round(probUp) + '%';
  document.getElementById('prob-down').textContent = Math.round(probDown) + '%';
}

function updateSignalBadge(sig) {
  var badge = document.getElementById('signal-badge');
  if (!sig || sig.direction === 'WAIT') {
    badge.classList.remove('visible');
    return;
  }
  badge.classList.add('visible');
  badge.className = 'visible ' + sig.direction.toLowerCase();
  var icon = sig.direction === 'LONG' ? '🚀' : '💥';
  badge.querySelector('.signal-badge-text').textContent = icon + ' ' + sig.direction + ' SNIPER';
}

function updateLevelsPanel(sig) {
  if (!sig || sig.direction === 'WAIT') {
    document.getElementById('level-entry').textContent = '--';
    document.getElementById('level-tp').textContent = '--';
    document.getElementById('level-sl').textContent = '--';
    return;
  }
  document.getElementById('level-entry').textContent = fmt(sig.entry);
  document.getElementById('level-tp').textContent = fmt(sig.tp);
  document.getElementById('level-sl').textContent = fmt(sig.sl);
}

function renderPredictionZone(sig) {
  var zoneLong = document.getElementById('prediction-zone-long');
  var zoneShort = document.getElementById('prediction-zone-short');

  if (!sig || !sig.entry || !sig.tp || !sig.sl || sig.direction === 'WAIT') {
    zoneLong.style.display = 'none';
    zoneShort.style.display = 'none';
    return;
  }

  var chartRect = document.getElementById('chart-container').getBoundingClientRect();
  var priceToY = function(price) {
    var minPrice = chartRect.bottom - 20;
    var maxPrice = chartRect.top + 20;
    var range = maxPrice - minPrice;
    var candleMin = candleData.length > 0 ? Math.min.apply(null, candleData.map(function(c) { return c.low; })) : 0;
    var candleMax = candleData.length > 0 ? Math.max.apply(null, candleData.map(function(c) { return c.high; })) : 1;
    var ratio = (price - candleMin) / (candleMax - candleMin || 1);
    return maxPrice - ratio * range;
  };

  var entryY = priceToY(sig.entry);
  var tpY = priceToY(sig.tp);
  var slY = priceToY(sig.sl);

  if (sig.direction === 'LONG') {
    zoneLong.style.display = 'block';
    zoneLong.style.top = (tpY - chartRect.top) + 'px';
    zoneLong.style.height = (entryY - tpY + chartRect.top) + 'px';

    zoneShort.style.display = 'block';
    zoneShort.style.top = (slY - chartRect.top) + 'px';
    zoneShort.style.height = (entryY - slY + chartRect.top) + 'px';
  } else {
    zoneShort.style.display = 'block';
    zoneShort.style.top = (entryY - chartRect.top) + 'px';
    zoneShort.style.height = (tpY - entryY + chartRect.top) + 'px';

    zoneLong.style.display = 'block';
    zoneLong.style.top = (entryY - chartRect.top) + 'px';
    zoneLong.style.height = (slY - entryY + chartRect.top) + 'px';
  }
}

function drawProjectionPath(sig) {
  try {
    var canvas = document.getElementById('projection-canvas');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    if (!ctx) return;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!sig || !sig.entry || !sig.tp || sig.direction === 'WAIT') return;

    var chartRect = document.getElementById('chart-container').getBoundingClientRect();
    var priceToY = function(price) {
      var minPrice = chartRect.bottom - 20;
      var maxPrice = chartRect.top + 20;
      var range = maxPrice - minPrice;
      var candleMin = candleData.length > 0 ? Math.min.apply(null, candleData.map(function(c) { return c.low; })) : 0;
      var candleMax = candleData.length > 0 ? Math.max.apply(null, candleData.map(function(c) { return c.high; })) : 1;
      var ratio = (price - candleMin) / (candleMax - candleMin || 1);
      return maxPrice - ratio * range;
    };

    var startX = chartRect.left + chartRect.width * 0.5;
    var startY = priceToY(sig.entry);
    var endY = priceToY(sig.tp);
    var steps = 20;

    var color = sig.direction === 'LONG' ? '#00ffaa' : '#ff4d6d';

    for (var i = 0; i < steps; i++) {
      var t = i / steps;
      var x = startX + (sig.direction === 'LONG' ? 1 : -1) * (i * 30);
      var baseY = startY + (endY - startY) * t;
      var wobble = Math.sin(t * Math.PI * 2) * 8;
      var y = baseY + wobble;

      ctx.beginPath();
      ctx.arc(x, y, 4, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.globalAlpha = 0.3 + t * 0.5;
      ctx.shadowBlur = 15;
      ctx.shadowColor = color;
      ctx.fill();

      if (i > 0) {
        var prevT = (i - 1) / steps;
        var prevX = startX + (sig.direction === 'LONG' ? 1 : -1) * ((i - 1) * 30);
        var prevBaseY = startY + (endY - startY) * prevT;
        var prevWobble = Math.sin(prevT * Math.PI * 2) * 8;
        var prevY = prevBaseY + prevWobble;

        ctx.beginPath();
        ctx.moveTo(prevX, prevY);
        ctx.lineTo(x, y);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.4 + t * 0.4;
        ctx.shadowBlur = 20;
        ctx.shadowColor = color;
        ctx.stroke();
      }
    }

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  } catch(e) { console.log('drawProjectionPath error:', e.message); }
}

function drawSignalArrow(sig) {
  if (!sig || !sig.candle || sig.direction === 'WAIT') return;

  markers = [{
    time: sig.candle.time / 1000,
    position: sig.direction === 'LONG' ? 'belowBar' : 'aboveBar',
    color: sig.direction === 'LONG' ? '#00ffaa' : '#ff4d6d',
    shape: sig.direction === 'LONG' ? 'arrowUp' : 'arrowDown',
    text: sig.direction + ' SNIPER'
  }];
  candleSeries.setMarkers(markers);
}

function clearDrawings() {
  markers = [];
  candleSeries.setMarkers([]);
}

function updatePrice(price, symbol) {
  latestPrices[symbol || activePair] = price;
  var priceEl = document.getElementById('price-label');
  if (symbol === activePair || !symbol) {
    priceEl.textContent = '$' + Number(price).toLocaleString(undefined, {minimumFractionDigits:4, maximumFractionDigits:4});
  }
}

function switchPair(symbol) {
  activePair = symbol;
  var btns = document.querySelectorAll('.pair-btn');
  btns.forEach(function(btn) {
    btn.classList.remove('active');
    if (btn.dataset.pair === symbol) btn.classList.add('active');
  });
  document.getElementById('pair-label').textContent = symbol.replace('USDT', '/USDT');
  clearDrawings();
  loadChart(symbol);
}

async function loadChart(symbol) {
  symbol = symbol || 'LABUSDT';
  var thisRequest = ++activeRequestId;
  console.log('loadChart fetching', symbol);
  try {
    var r = await fetch(API_URL + '/candles?tf=15m&symbol=' + symbol);
    if (thisRequest !== activeRequestId) { console.log('stale request, ignoring'); return; }
    console.log('loadChart response status:', r.status);
    if (!r.ok) { console.log('fetch not ok'); return; }
    var data = await r.json();
    if (thisRequest !== activeRequestId) return;
    console.log('loadChart data candles:', data.candles ? data.candles.length : 0);
    if (!data.candles || !data.candles.length) { console.log('no candles'); return; }

    var cdata = data.candles.map(function(c) {
      return { time: c.time / 1000, open: c.open, high: c.high, low: c.low, close: c.close };
    });
    candleData = cdata;
    console.log('Setting', cdata.length, 'candles to chart');
    candleSeries.setData(cdata);
    chart.timeScale().fitContent();

    var lastClose = cdata.length > 0 ? cdata[cdata.length - 1].close : null;
    console.log('Last close price:', lastClose);
    if (lastClose) updatePrice(lastClose, symbol);

    if (symbol === 'LABUSDT' || symbol === 'LAB-USDT') {
      var labSig = detectLabSignal(cdata);
      console.log('labSig:', labSig ? labSig.direction : 'null');
      if (labSig) {
        updateAIPanel(labSig);
        updateSignalBadge(labSig);
        updateLevelsPanel(labSig);
        renderPredictionZone(labSig);
        drawProjectionPath(labSig);
        drawSignalArrow(labSig);
      }
    }
  } catch(e) {
    console.log('chart load error:', e.message);
  }
}

function connect() {
  var ws = new WebSocket(
    location.protocol === 'file:' ? 'ws://localhost:3001'
    : (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host
  );
  ws.onopen = function() { console.log('ws connected'); };
  ws.onmessage = function(e) {
    try {
      var msg = JSON.parse(e.data);
      console.log('WS message:', msg.type, msg.pair || '');
      if (msg.type === 'price_tick') {
        var pt = msg.data || {};
        var tickSymbol = pt.symbol || msg.pair || 'BTCUSDT';
        if (pt.price) {
          console.log('price tick:', pt.price, tickSymbol);
          updatePrice(pt.price, tickSymbol);
        }
      }
      if (msg.type === 'lab_signal') {
        var lab = msg.data || {};
        console.log('lab_signal:', lab.direction);
        updateAIPanel(lab);
        updateSignalBadge(lab);
        updateLevelsPanel(lab);
        renderPredictionZone(lab);
        drawProjectionPath(lab);
        drawSignalArrow(lab);
      }
      if (msg.type === 'market_data') {
        var pd = msg.data;
        var mPair = msg.pair || 'BTCUSDT';
        if (mPair === activePair && pd && pd.close) {
          updatePrice(pd.close, mPair);
        }
      }
    } catch(e) { console.log('parse error:', e); }
  };
  ws.onclose = function() { setTimeout(connect, 3000); };
}

initChart();
loadChart();
connect();

document.querySelectorAll('.pair-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    switchPair(this.dataset.pair);
  });
});
</script>
